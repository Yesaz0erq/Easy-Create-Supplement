plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = '1.0-K2'
group = 'com.easycreate'
base { archivesName = 'easy-create-supplement-forge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); mods { easycreate { source sourceSets.main } } }
        client {}
        gameTestServer {}
        server { args '--nogui' }
    }
}
mixin { add sourceSets.main, 'easycreate.refmap.json'; config 'easycreate.mixins.json' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    implementation fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')
    implementation fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    compileOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6-281')
    runtimeOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.6-281')
    implementation fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar', Jar).configure {
    manifest { attributes 'MixinConfigs': 'easycreate.mixins.json', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
